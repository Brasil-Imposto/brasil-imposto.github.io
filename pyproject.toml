# The Python side of Brasil-Imposto: the pipelines, the preview builders and their tests. Not a package; uv installs the
# pinned dependencies from uv.lock (`uv sync --locked`).
[project]
name = "brasil-imposto"
version = "1.0.0"
description = "Quanto cada estado envia e recebe da União, com dados oficiais e código aberto."
license = "AGPL-3.0-only"
requires-python = "==3.12.*"
dependencies = [
    "duckdb==2.0.0",
    "jsonschema==4.26.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
]

[dependency-groups]
# atheris (Google, Apache-2.0) fuzzes the address checks in the ci (D228, pipelines/fuzz/); it has wheels for Linux on x86_64
# only, so other machines leave it out
dev = ["atheris==3.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv]
package = false
