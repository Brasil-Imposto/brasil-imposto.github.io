# The deploy of the staging site (spec BRASIL-IMPOSTO_SPEC_staging_2026-10-23, section 4). This file is the source: the workflow
# runs from .github/workflows/deploy.yml of the Brasil-Imposto/staging repository, which holds nothing built. It checks out the
# staging branch of Brasil-Imposto/brasil-imposto.github.io, builds the staging profile and publishes it on that repository's
# GitHub Pages, at https://brasil-imposto.github.io/staging/. Started by the dispatch of staging-dispatch.yml on every push to
# staging, or by hand (the button, for when the dispatch fails). Actions pinned by commit, as in ci.yml.
name: deploy
on:
  repository_dispatch:
    types: [staging-updated]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Brasil-Imposto/brasil-imposto.github.io
          ref: staging
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the staging site
        run: python3 docs/superpowers/tools/build-site.py --profile staging --out _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
