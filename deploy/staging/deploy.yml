# The deploy of the staging site (spec BRASIL-IMPOSTO_SPEC_staging_2026-10-23, section 4). This file is the source: the workflow
# runs from .github/workflows/deploy.yml of the Brasil-Imposto/staging repository, which holds nothing built. It checks out the
# staging branch of Brasil-Imposto/brasil-imposto.github.io, builds the staging profile and publishes it on that repository's
# GitHub Pages, at https://brasil-imposto.github.io/staging/. Started by the dispatch of staging-dispatch.yml on every push to
# staging, or by hand (the button, for when the dispatch fails). Actions pinned by commit, as in ci.yml.
name: deploy
on:
  repository_dispatch:
    types: [staging-updated]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Brasil-Imposto/brasil-imposto.github.io
          ref: staging
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv and the locked Python environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r .github/uv-requirements.txt
          uv lock --check
          uv sync --locked
      - name: Data tests before publishing (Phase 2, P2; on a failure nothing is uploaded and the live site stays as it was)
        run: uv run --locked python -m unittest discover -s pipelines/tests -v
      - name: The committed pages are what their builders make (as in ci.yml)
        run: |
          python docs/superpowers/tools/build-cases.py
          python docs/superpowers/tools/build-standalone-data.py
          python docs/superpowers/tools/build-simulation.py
          python docs/superpowers/tools/build-platform-preview.py
          python docs/superpowers/tools/build-site-chrome.py
          python docs/superpowers/tools/build-notes-page.py
          python docs/superpowers/tools/build-ledger-page.py
          git diff --exit-code -- docs/superpowers/previews/
      - name: Build the staging site
        run: python3 docs/superpowers/tools/build-site.py --profile staging --out _site
      - name: The manifest of this publication, every file with its sha256 (spec seguranca-doacoes, section 6)
        run: python3 docs/superpowers/tools/build-manifest.py write _site "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      # The Pages artifact built here, as upload-pages-artifact's README allows (one tar named github-pages): the steps of
      # upload-pages-artifact v3.0.1, whose inner upload-artifact@v4 the SHA rule refuses, with upload-artifact v4.6.2 by
      # commit, the version the last good deploy used. The dot files stay in (.well-known/security.txt, .nojekyll). D228
      - name: Archive the site for Pages
        run: |
          tar \
            --dereference --hard-dereference \
            --directory _site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
