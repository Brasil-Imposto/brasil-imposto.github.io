# Publishes the site on GitHub Pages: rebuilds the preview packages from data/ and serves the latest preview of each page.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the preview packages
        run: |
          python3 docs/superpowers/tools/build-cases.py
          python3 docs/superpowers/tools/build-standalone-data.py
          python3 docs/superpowers/tools/build-simulation.py
          python3 docs/superpowers/tools/build-platform-preview.py
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R docs/superpowers/previews/assets _site/assets
          cp docs/superpowers/previews/BRASIL-IMPOSTO_DESIGN_*.html _site/
          cp docs/superpowers/previews/BRASIL-IMPOSTO_DESIGN_platform-preview_2026-10-09.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
