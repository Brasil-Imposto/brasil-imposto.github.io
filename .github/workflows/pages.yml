# Publishes the production site on GitHub Pages: build-site.py rebuilds the preview packages from data/ and assembles the three
# published pages in the production profile (the staging site is published by Brasil-Imposto/staging, deploy/staging/deploy.yml).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble the site (the production profile, spec staging section 3)
        # the four page builders, the three published pages, assets/, index.html, the forwarding page at Início's old address
        # (D160), .nojekyll and robots.txt; only the switches of data/features.json that production turns on
        run: python3 docs/superpowers/tools/build-site.py --profile production --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
