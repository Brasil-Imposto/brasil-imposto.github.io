# CodeQL (Phase 2, P8; D193): the code scanning the staging rule requires before a merge. It runs as a workflow of the
# repository, not GitHub's default setup, so pull requests from forks are analyzed too (held for the maintainer's approval the
# first time, like ci and dco); the default setup did not analyze #124 and no outside pull request could merge. Read-only at the
# top; the job writes only its results (security-events). Actions pinned by commit, as in ci.yml.
name: codeql
on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]
  schedule:
    - cron: "41 5 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
