# OpenSSF Scorecard (Phase 2, D3; issue #11; D172, question 40): scores the repository's security practices every week, on every
# push to staging (the default branch) and on every change of the branch rules. The results go to the Security tab (code
# scanning, tool "Scorecard") and to the public Scorecard API, which serves the README badge. Read-only at the top; the job may
# only upload its SARIF (security-events) and sign the published results (id-token). Actions pinned by commit, as in ci.yml.
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [staging]
  workflow_dispatch:
permissions: read-all
jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
