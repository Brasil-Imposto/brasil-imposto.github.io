# Checks every pull request and every push to main (phase B0 of the Astro site). A red check blocks the merge once the
# maintainer makes `ci` a required check. Read-only token; actions pinned by commit; never pull_request_target.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv and the locked Python environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.32
          uv lock --check
          uv sync --locked
      - name: Repository layout and Python environment
        run: uv run --locked python -m unittest discover -s pipelines/tests -v
      - name: Ledger tests
        run: uv run --locked python -m unittest discover -s pipelines/ledger/tests -v
