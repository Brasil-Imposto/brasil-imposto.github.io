# Checks every pull request and every push to staging and to main (phase B0 of the Astro site; spec staging, section 6). A red
# check blocks the merge once the maintainer makes `ci` a required check. Read-only token; actions pinned by commit; never
# pull_request_target.
name: ci
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv and the locked Python environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r .github/uv-requirements.txt
          uv lock --check
          uv sync --locked
      - name: Repository layout and Python environment
        run: uv run --locked python -m unittest discover -s pipelines/tests -v
      - name: Fuzz the address checks for 60 seconds, after the fuzzer finds a planted crash (D228)
        run: |
          uv run --locked python pipelines/fuzz/fuzz_addresses.py control
          uv run --locked python pipelines/fuzz/fuzz_addresses.py run 60
      - name: Entity files (exported from data/, each validated against its schema before it is written)
        run: uv run --locked python pipelines/export/build_entities.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: "Site (Astro): install, types from the schemas, astro check and tsc, Vitest, build"
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run types
          npm run check
          npm test
          npm run build
      - name: Ledger tests
        run: uv run --locked python -m unittest discover -s pipelines/ledger/tests -v
      - name: The committed pages are what their builders make (header, footer and map loader from one source, D152)
        run: |
          python docs/superpowers/tools/build-cases.py
          python docs/superpowers/tools/build-standalone-data.py
          python docs/superpowers/tools/build-simulation.py
          python docs/superpowers/tools/build-platform-preview.py
          python docs/superpowers/tools/build-site-chrome.py
          python docs/superpowers/tools/build-notes-page.py
          git diff --exit-code -- docs/superpowers/previews/
      - name: Map loader (the page's size equals the built data file)
        run: uv run --locked python -m unittest pipelines/tests/test_map_loader.py -v

  security:
    # spec seguranca-doacoes, section 14: the attacks of phase 1 against the staging build, each with its control; a broken
    # control fails the job (bash -e)
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/superpowers/tools/package-lock.json
      - name: The pinned browser and the lint rule
        working-directory: docs/superpowers/tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --only-shell chromium
      - name: "No unescaped HTML: the Firefox rule, with the list of what existed on 2026-11-03, which only shrinks"
        run: docs/superpowers/tools/node_modules/.bin/eslint --config docs/superpowers/tools/eslint.config.mjs --suppressions-location docs/superpowers/tools/eslint-suppressions.json 'docs/superpowers/previews/assets/*.js'
      - name: "Attacks P1 (poisoned data), P2 (an injected handler) and P9 (Google Fonts), each with its control"
        run: |
          python docs/superpowers/tools/build-site.py --profile staging --out "$RUNNER_TEMP/site"
          python docs/superpowers/tools/poison-data.py "$RUNNER_TEMP/site" "$RUNNER_TEMP/poison"
          cp -R "$RUNNER_TEMP/poison" "$RUNNER_TEMP/poison-control"
          cd docs/superpowers/tools
          node poison-check.cjs "$RUNNER_TEMP/poison"
          node poison-check.cjs "$RUNNER_TEMP/poison-control" --control
          node csp-check.cjs "$RUNNER_TEMP/site"
          node csp-check.cjs "$RUNNER_TEMP/site" --control
          node fonts-check.cjs "$RUNNER_TEMP/site"
          node fonts-check.cjs "$RUNNER_TEMP/site" --control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Brasil-Imposto/monitor
          ref: 5952110570d68061e5dac89e23f556da1f25005f # the served-files check and pins.json, Brasil-Imposto/monitor#2
          path: .monitor
          persist-credentials: false
      - name: "Attacks B1 (a served file changed, alone or with the manifest) and L1 (an address changed), the monitor's check on this build, each with its control"
        # spec seguranca-doacoes, section 7: until the production batch the check runs here, on the staging build served the way
        # GitHub Pages serves it (ETag, 304, gzip): a full pass, the "did it change?" pass of D222 (2), then the four controls.
        # The addresses of data/support.json must equal the monitor's own copy, pins.json.
        run: |
          out=$(python3 docs/superpowers/tools/build-manifest.py write "$RUNNER_TEMP/site" "$GITHUB_SHA")
          echo "$out"
          set_hash=${out##*: }
          node docs/superpowers/tools/static-server.cjs "$RUNNER_TEMP/site" 8795 --pages > "$RUNNER_TEMP/served-server.log" 2>&1 &
          for i in $(seq 50); do curl -fsS -o /dev/null http://127.0.0.1:8795/index.html && break; sleep 0.2; done
          served() { python3 .monitor/checks/served.py --base http://127.0.0.1:8795/ --commit "$GITHUB_SHA" --set-hash "$set_hash" "$@"; }
          served --full --state "$RUNNER_TEMP/served.json"
          served --state "$RUNNER_TEMP/served.json"
          unchanged=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))['files']) - 4)" "$RUNNER_TEMP/site/build-manifest.json")
          test "$(grep -c '^304 ' "$RUNNER_TEMP/served-server.log")" -eq "$unchanged"   # the second pass: 304 for all but the 4 address pages
          for c in b1 manifest l1 csp; do served --control "$c"; done
