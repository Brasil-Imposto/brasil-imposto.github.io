# Dependency updates (trust spec, D2): weekly, one grouped pull request per ecosystem, into staging like every change.
# The workflows of .github/workflows/ (github-actions), the Python lock uv.lock (uv) and the site's package-lock.json (npm).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/site"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    groups:
      site:
        patterns:
          - "*"
